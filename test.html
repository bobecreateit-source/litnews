<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視訊會議 (最終完整版)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        /* 影片容器，用來定位狀態標籤 */
        .video-wrapper { position: relative; }
        
        video {
            width: 100%;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: block; /* 消除底部空隙 */
        }

        /* 狀態標籤 (例如：對方已靜音) - 可選 */
        .status-label {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .controls { 
            margin: 20px 0; padding: 20px; 
            background: #fff; border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* 按鈕樣式優化 */
        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        
        button {
            padding: 10px 20px; cursor: pointer;
            background-color: #4285F4; color: white; border: none; border-radius: 5px;
            font-size: 16px; transition: background 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.secondary { background-color: #34A853; } /* 綠色 */
        
        /* 紅色按鈕表示「關閉/掛斷」狀態 */
        button.off { background-color: #EA4335; } 

        input { padding: 10px; width: 200px; border: 1px solid #ccc; border-radius: 5px; }
        
        .hidden { display: none; }
        .info-text { color: #555; margin-bottom: 10px; font-size: 0.9em; }
        #linkDisplay { font-weight: bold; color: #d93025; word-break: break-all;}
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center;">視訊會議系統</h1>

    <div id="loginSection" style="text-align:center; margin-top:50px;">
        <p>請先登入以開始使用</p>
        <button onclick="loginWithGoogle()">使用 Google 帳戶登入</button>
    </div>

    <div id="appSection" class="hidden">
        <div class="controls">
            <p>歡迎, <span id="userInfo" style="font-weight:bold; color:#4285F4;"></span></p>
            
            <div style="background: #e8f0fe; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                <p class="info-text">邀請連結：</p>
                <p id="linkDisplay">正在產生...</p>
                <button class="secondary" onclick="copyLink()">複製連結</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <div class="btn-group">
                <button id="btnMic" onclick="toggleAudio()">關閉麥克風</button>
                <button id="btnCam" onclick="toggleVideo()">關閉鏡頭</button>
            </div>
            
            <div style="margin-top: 15px;">
                <input type="text" id="remoteIdInput" placeholder="或手動輸入對方 ID">
                <button onclick="manualCall()">撥打</button>
            </div>
        </div>

        <div class="video-grid">
            <div class="video-wrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="status-label">你 (本地預覽)</div>
            </div>
            <div id="remoteVideoContainer">
                </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. Firebase 設定 (請換成你自己的！)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCTqHCcZRR0s0UqGsu5Oid9DVY7bawz6dU",
      authDomain: "litnews-e5aa4.firebaseapp.com",
      projectId: "litnews-e5aa4",
      storageBucket: "litnews-e5aa4.firebasestorage.app",
      messagingSenderId: "265413322210",
      appId: "1:265413322210:web:1dd0d0a1443e4ea0b905bb",
      measurementId: "G-XTK22HB3T3"
    };

    try { firebase.initializeApp(firebaseConfig); } catch (e) { console.error(e); }

    let localStream;
    let peer; 
    let myPeerId;

    // 狀態變數
    let isAudioEnabled = true;
    let isVideoEnabled = true;

    const urlParams = new URLSearchParams(window.location.search);
    const targetIdFromUrl = urlParams.get('call');

    // ==========================================
    // 2. Google 登入與流程
    // ==========================================
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        firebase.auth().signInWithPopup(provider)
            .then((result) => {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('userInfo').innerText = result.user.displayName;
                startLocalStream().then(() => initPeerJS());
            })
            .catch((err) => alert("登入失敗: " + err.message));
    }

    // ==========================================
    // 3. 媒體串流控制 (新增重點)
    // ==========================================
    async function startLocalStream() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
        } catch (err) {
            alert("無法存取相機/麥克風");
            console.error(err);
        }
    }

    // 切換麥克風
    function toggleAudio() {
        if (!localStream) return;
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
            // 切換狀態
            isAudioEnabled = !isAudioEnabled;
            audioTrack.enabled = isAudioEnabled; // 真正的開關邏輯
            
            // 更新按鈕外觀
            const btn = document.getElementById('btnMic');
            if (isAudioEnabled) {
                btn.innerText = "關閉麥克風";
                btn.classList.remove('off');
            } else {
                btn.innerText = "開啟麥克風";
                btn.classList.add('off'); // 變紅色
            }
        }
    }

    // 切換鏡頭
    function toggleVideo() {
        if (!localStream) return;
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            isVideoEnabled = !isVideoEnabled;
            videoTrack.enabled = isVideoEnabled; // 真正的開關邏輯
            
            const btn = document.getElementById('btnCam');
            if (isVideoEnabled) {
                btn.innerText = "關閉鏡頭";
                btn.classList.remove('off');
            } else {
                btn.innerText = "開啟鏡頭";
                btn.classList.add('off'); // 變紅色
            }
        }
    }

    // ==========================================
    // 4. PeerJS 連線
    // ==========================================
    function initPeerJS() {
        peer = new Peer(); 

        peer.on('open', (id) => {
            myPeerId = id;
            const currentUrl = window.location.href.split('?')[0];
            const inviteLink = `${currentUrl}?call=${id}`;
            document.getElementById('linkDisplay').innerText = inviteLink;

            if (targetIdFromUrl) {
                setTimeout(() => { callUser(targetIdFromUrl); }, 1000); 
            }
        });

        peer.on('call', (call) => {
            call.answer(localStream);
            setupRemoteVideo(call);
        });
    }

    function callUser(remoteId) {
        if(!remoteId) return alert("沒有 ID");
        const call = peer.call(remoteId, localStream);
        setupRemoteVideo(call);
    }

    function manualCall() {
        callUser(document.getElementById('remoteIdInput').value);
    }

    function setupRemoteVideo(call) {
        call.on('stream', (remoteStream) => {
            if(document.getElementById(`video-${call.peer}`)) return;

            const videoWrapper = document.createElement('div');
            videoWrapper.className = 'video-wrapper';
            videoWrapper.innerHTML = `
                <video id="video-${call.peer}" autoplay playsinline></video>
                <div class="status-label">對方畫面</div>
            `;
            
            // 重要：這裡不加 muted，否則會聽不到對方聲音
            const video = videoWrapper.querySelector('video');
            video.srcObject = remoteStream;
            
            document.getElementById('remoteVideoContainer').appendChild(videoWrapper);
        });
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('linkDisplay').innerText)
            .then(() => alert("連結已複製"));
    }
</script>
</body>
</html>
